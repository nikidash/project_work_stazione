services:
  db:
    container_name: pw-db
    image: postgres
    restart: always
    shm_size: 128mb
    ports:
      - 5678:5432
    environment:
      POSTGRES_PASSWORD: adminpass
      POSTGRES_DB: pw-stazione
    volumes:
      - pw_db_data:/var/lib/postgresql/data
      - ./create_queries.sql:/docker-entrypoint-initdb.d/create_queries.sql:ro

  pgadmin:
    container_name: pw-pgadmin
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8080:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: adminpass
    volumes:
      - pw_pgadmin_data:/etc/pgadmin/data

volumes:
  pw_db_data:
  pw_pgadmin_data:
